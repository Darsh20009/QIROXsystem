workflows:

  # ─── iOS Build (No Signing) — للاختبار فقط ────────────────────────────────
  ios-build:
    name: iOS Build (No Signing)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: v20.20.0
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "qiroxstudio.online"
        APP_NAME: "QIROX Studio"
        APP_URL: "https://qiroxstudio.online"

    scripts:
      - name: Install dependencies and build web assets
        script: |
          set -e
          npm install --legacy-peer-deps --ignore-scripts --omit=optional
          npm install -g vite@7 @vitejs/plugin-react @tailwindcss/vite
          GLOBAL=$(npm root -g)
          mkdir -p node_modules/@vitejs node_modules/@tailwindcss
          rm -rf node_modules/vite && cp -rL "$GLOBAL/vite" node_modules/vite
          rm -rf node_modules/@vitejs/plugin-react && cp -rL "$GLOBAL/@vitejs/plugin-react" node_modules/@vitejs/plugin-react
          rm -rf node_modules/@tailwindcss/vite && cp -rL "$GLOBAL/@tailwindcss/vite" node_modules/@tailwindcss/vite
          node node_modules/vite/bin/vite.js build

      - name: Add iOS platform (if not present)
        script: |
          if [ ! -d "ios" ]; then npx cap add ios; fi

      - name: Sync Capacitor to iOS
        script: |
          set -e
          CAP_VER="7.6.7"
          npm install --legacy-peer-deps --omit=optional @capacitor/core || true
          mkdir -p node_modules/@capacitor/ios
          curl -sL "https://registry.npmjs.org/@capacitor/ios/-/ios-${CAP_VER}.tgz" \
            | tar -xz --strip-components=1 -C node_modules/@capacitor/ios
          npm install -g @capacitor/cli@${CAP_VER}
          cap sync ios

      - name: Set App Icon
        script: |
          ICON_SRC="client/public/qirox-icon.png"
          ICON_DEST="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          if [ -f "$ICON_SRC" ] && [ -d "$ICON_DEST" ]; then
            sips -z 1024 1024 "$ICON_SRC" --out "$ICON_DEST/Icon-1024.png"
          fi

      - name: Install CocoaPods
        script: cd ios/App && pod install

      - name: Build iOS (no signing)
        script: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - /tmp/xcodebuild_logs/*.log

  # ─── iOS Release (App Store / TestFlight) ─────────────────────────────────
  ios-release:
    name: iOS Release - TestFlight / App Store
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      node: v20.20.0
      xcode: latest
      cocoapods: default
      groups:
        - ios-credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: qiroxstudio.online
      vars:
        BUNDLE_ID: "qiroxstudio.online"
        APP_NAME: "QIROX Studio"
        APP_URL: "https://qiroxstudio.online"
        NOTIFY_EMAIL: "qiroxsystem@gmail.com"

    scripts:
      - name: Install dependencies and build web assets
        script: |
          set -e
          npm install --legacy-peer-deps --ignore-scripts --omit=optional
          npm install -g vite@7 @vitejs/plugin-react @tailwindcss/vite
          GLOBAL=$(npm root -g)
          mkdir -p node_modules/@vitejs node_modules/@tailwindcss
          rm -rf node_modules/vite && cp -rL "$GLOBAL/vite" node_modules/vite
          rm -rf node_modules/@vitejs/plugin-react && cp -rL "$GLOBAL/@vitejs/plugin-react" node_modules/@vitejs/plugin-react
          rm -rf node_modules/@tailwindcss/vite && cp -rL "$GLOBAL/@tailwindcss/vite" node_modules/@tailwindcss/vite
          node node_modules/vite/bin/vite.js build

      - name: Add iOS platform (if not present)
        script: |
          if [ ! -d "ios" ]; then npx cap add ios; fi

      - name: Sync Capacitor to iOS
        script: |
          set -e
          CAP_VER="7.6.7"
          npm install --legacy-peer-deps --omit=optional @capacitor/core || true
          mkdir -p node_modules/@capacitor/ios
          curl -sL "https://registry.npmjs.org/@capacitor/ios/-/ios-${CAP_VER}.tgz" \
            | tar -xz --strip-components=1 -C node_modules/@capacitor/ios
          npm install -g @capacitor/cli@${CAP_VER}
          cap sync ios

      - name: Set minimum iOS version to 16.0
        script: |
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '16.0'/" ios/App/Podfile || true
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 16.0/g' \
            ios/App/App.xcodeproj/project.pbxproj || true

      - name: Set App Icon (all sizes)
        script: |
          ICON_SRC="client/public/qirox-icon.png"
          ICON_DEST="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICON_DEST"
          if [ -f "$ICON_SRC" ]; then
            sips -z 20   20   "$ICON_SRC" --out "$ICON_DEST/Icon-20.png"
            sips -z 29   29   "$ICON_SRC" --out "$ICON_DEST/Icon-29.png"
            sips -z 40   40   "$ICON_SRC" --out "$ICON_DEST/Icon-40.png"
            sips -z 58   58   "$ICON_SRC" --out "$ICON_DEST/Icon-58.png"
            sips -z 60   60   "$ICON_SRC" --out "$ICON_DEST/Icon-60.png"
            sips -z 76   76   "$ICON_SRC" --out "$ICON_DEST/Icon-76.png"
            sips -z 80   80   "$ICON_SRC" --out "$ICON_DEST/Icon-80.png"
            sips -z 87   87   "$ICON_SRC" --out "$ICON_DEST/Icon-87.png"
            sips -z 120  120  "$ICON_SRC" --out "$ICON_DEST/Icon-120.png"
            sips -z 152  152  "$ICON_SRC" --out "$ICON_DEST/Icon-152.png"
            sips -z 167  167  "$ICON_SRC" --out "$ICON_DEST/Icon-167.png"
            sips -z 180  180  "$ICON_SRC" --out "$ICON_DEST/Icon-180.png"
            sips -z 1024 1024 "$ICON_SRC" --out "$ICON_DEST/Icon-1024.png"

            # Contents.json — required for asset catalog to be recognized
            cat > "$ICON_DEST/Contents.json" << 'ICONEOF'
{
  "images": [
    {"idiom":"iphone","size":"20x20","scale":"2x","filename":"Icon-40.png"},
    {"idiom":"iphone","size":"20x20","scale":"3x","filename":"Icon-60.png"},
    {"idiom":"iphone","size":"29x29","scale":"1x","filename":"Icon-29.png"},
    {"idiom":"iphone","size":"29x29","scale":"2x","filename":"Icon-58.png"},
    {"idiom":"iphone","size":"29x29","scale":"3x","filename":"Icon-87.png"},
    {"idiom":"iphone","size":"40x40","scale":"2x","filename":"Icon-80.png"},
    {"idiom":"iphone","size":"40x40","scale":"3x","filename":"Icon-120.png"},
    {"idiom":"iphone","size":"60x60","scale":"2x","filename":"Icon-120.png"},
    {"idiom":"iphone","size":"60x60","scale":"3x","filename":"Icon-180.png"},
    {"idiom":"ipad","size":"20x20","scale":"1x","filename":"Icon-20.png"},
    {"idiom":"ipad","size":"20x20","scale":"2x","filename":"Icon-40.png"},
    {"idiom":"ipad","size":"29x29","scale":"1x","filename":"Icon-29.png"},
    {"idiom":"ipad","size":"29x29","scale":"2x","filename":"Icon-58.png"},
    {"idiom":"ipad","size":"40x40","scale":"1x","filename":"Icon-40.png"},
    {"idiom":"ipad","size":"40x40","scale":"2x","filename":"Icon-80.png"},
    {"idiom":"ipad","size":"76x76","scale":"1x","filename":"Icon-76.png"},
    {"idiom":"ipad","size":"76x76","scale":"2x","filename":"Icon-152.png"},
    {"idiom":"ipad","size":"83.5x83.5","scale":"2x","filename":"Icon-167.png"},
    {"idiom":"ios-marketing","size":"1024x1024","scale":"1x","filename":"Icon-1024.png"}
  ],
  "info":{"version":1,"author":"xcode"}
}
ICONEOF

            # Set CFBundleIconName in Info.plist — required by Apple (error 90713)
            PLIST="ios/App/App/Info.plist"
            /usr/libexec/PlistBuddy -c "Add :CFBundleIconName string AppIcon" "$PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :CFBundleIconName AppIcon" "$PLIST"
            echo "✅ AppIcon: all sizes generated + CFBundleIconName set"
          else
            echo "❌ Icon source not found: $ICON_SRC"
            exit 1
          fi

      - name: Inject Info.plist (Permissions + URL Scheme)
        script: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Camera access for QR and face recognition'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'Camera access for QR and face recognition'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Microphone access for video meetings'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription 'Microphone access for video meetings'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Photo library access for file uploads'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'Photo library access for file uploads'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string 'Face ID for secure authentication'" "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSFaceIDUsageDescription 'Face ID for secure authentication'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string qiroxstudio.online" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string qirox" "$PLIST" 2>/dev/null || true

      - name: Inject App.entitlements
        script: |
          cat > "ios/App/App/App.entitlements" << 'ENTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>aps-environment</key>
            <string>production</string>
            <key>com.apple.developer.associated-domains</key>
            <array>
              <string>applinks:qiroxstudio.online</string>
              <string>webcredentials:qiroxstudio.online</string>
            </array>
          </dict>
          </plist>
          ENTEOF

      - name: Install CocoaPods
        script: cd ios/App && pod install

      - name: Set up code signing and build IPA
        script: |
          set -e
          keychain add-certificates
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"

      - name: Publish to TestFlight
        script: |
          set -e

          # ── Diagnose: which APP_STORE_CONNECT_* vars are visible ──────────────
          echo "=== Environment variable names (no values) ==="
          env | grep -i "app_store\|apple_team\|asc_" | sed 's/=.*/=<SET>/' || echo "No APP_STORE vars found in env"
          echo "=== Raw length of PUBLISHER_PRIVATE_KEY ==="
          python3 -c "import os; v=os.environ.get('APP_STORE_CONNECT_PUBLISHER_PRIVATE_KEY',''); print(f'Length: {len(v)}')"
          echo "============================================="

          # Use Python3 to decode the key — handles both escaped \n and real newlines
          python3 << 'PYEOF'
          import os, sys
          key = os.environ.get('APP_STORE_CONNECT_PUBLISHER_PRIVATE_KEY', '')
          # Replace escaped \n (literal backslash+n) with real newlines
          key = key.replace('\\n', '\n').strip()
          with open('/tmp/asc_key.p8', 'w') as f:
              f.write(key + '\n')
          lines = key.splitlines()
          print(f"Key lines written: {len(lines)}")
          print(f"First line: {lines[0] if lines else 'EMPTY'}")
          PYEOF

          if ! head -1 /tmp/asc_key.p8 | grep -q 'BEGIN'; then
            echo "Key does not start with BEGIN header. Content preview:"
            head -5 /tmp/asc_key.p8
            exit 1
          fi

          IPA=$(find build/ios/ipa -name "*.ipa" | head -1)
          [ -z "$IPA" ] && echo "No IPA found in build/ios/ipa/" && exit 1
          echo "Publishing: $IPA"

          app-store-connect publish \
            --path "$IPA" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --private-key @file:/tmp/asc_key.p8 \
            --testflight

          echo "Uploaded to TestFlight successfully"

    publishing:
      email:
        recipients:
          - qiroxsystem@gmail.com
        notify:
          success: true
          failure: true

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

  # ─── Android TWA - Google Play ─────────────────────────────────────────────
  android-release:
    name: Android TWA - Google Play
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      node: v20.20.0
      java: 17
      vars:
        PACKAGE_NAME: "online.qiroxstudio.twa"
        APP_URL: "https://qiroxstudio.online"

    scripts:
      - name: Decode keystore
        script: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android-twa/qirox-android.keystore

      - name: Install Bubblewrap CLI
        script: npm install -g @bubblewrap/cli

      - name: Build Android TWA (AAB)
        script: |
          set -e
          cd android-twa
          bubblewrap build --skipPwaValidation --manifest twa-manifest.json

      - name: Sign AAB
        script: |
          set -e
          cd android-twa
          AAB=$(find . -name "*.aab" | head -1)
          jarsigner \
            -keystore qirox-android.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$AAB" "$KEY_ALIAS"

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
      email:
        recipients:
          - qiroxsystem@gmail.com
        notify:
          success: true
          failure: true

    artifacts:
      - android-twa/**/*.aab
      - android-twa/**/*.apk

  # ─── Web Build ─────────────────────────────────────────────────────────────
  web-build:
    name: QIROX Web Build
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      node: v20.20.0
    scripts:
      - name: Install dependencies and build
        script: |
          set -e
          npm install --legacy-peer-deps --ignore-scripts
          npm install -g vite@7 @vitejs/plugin-react @tailwindcss/vite
          GLOBAL=$(npm root -g)
          mkdir -p node_modules/@vitejs node_modules/@tailwindcss
          rm -rf node_modules/vite && cp -rL "$GLOBAL/vite" node_modules/vite
          rm -rf node_modules/@vitejs/plugin-react && cp -rL "$GLOBAL/@vitejs/plugin-react" node_modules/@vitejs/plugin-react
          rm -rf node_modules/@tailwindcss/vite && cp -rL "$GLOBAL/@tailwindcss/vite" node_modules/@tailwindcss/vite
          node node_modules/vite/bin/vite.js build

      - name: Build server
        script: |
          PKG_DEPS=$(node -e "
            const p = require('./package.json');
            const all = [...Object.keys(p.dependencies||{}), ...Object.keys(p.devDependencies||{})];
            const allow = new Set(['axios','express','express-rate-limit','express-session','nodemailer','openai','passport','passport-local','pg','uuid','ws','zod','zod-validation-error','mongoose','connect-mongo','web-push','node-cron','pdf-lib','exceljs','mammoth','file-saver','fabric','recharts','digest-fetch','@paypal/paypal-server-sdk','bcrypt','bcryptjs','compression','multer','memorystore','simple-git','archiver','imapflow','mailparser','speakeasy']);
            console.log(all.filter(d => !allow.has(d)).map(d => '--external:' + d).join(' '));
          ")
          node_modules/.bin/esbuild server/index.ts \
            --platform=node --bundle --format=cjs \
            --outfile=dist/index.cjs \
            "--define:process.env.NODE_ENV=\"production\"" \
            --minify $PKG_DEPS

    publishing:
      email:
        recipients:
          - qiroxsystem@gmail.com
        notify:
          success: true
          failure: true

    artifacts:
      - dist/**
